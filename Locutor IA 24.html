<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard DJ IA - La Fronterísima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .pulse { animation: pulse-blue 2s infinite; }
        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                FRONTERÍSIMA
            </h1>
            <p class="text-slate-400 font-medium tracking-[0.2em] text-xs uppercase">AI Broadcasting System</p>
        </div>

        <div class="glass rounded-[2rem] p-8 shadow-2xl space-y-8">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Estado Actual</p>
                    <div class="flex items-center space-x-2">
                        <div id="led" class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></div>
                        <h2 id="status" class="text-xl font-bold text-slate-200 uppercase tracking-tight">Cargando...</h2>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Último Envío</p>
                    <p id="fecha" class="text-xl font-mono font-bold text-blue-400 tracking-tighter">--:--:--</p>
                </div>
            </div>

            <div class="bg-slate-900/80 rounded-2xl p-6 border border-slate-700/50 shadow-inner">
                <p class="text-[10px] text-slate-500 uppercase font-bold mb-3 tracking-widest">Monitor de Guion</p>
                <p id="guion" class="text-slate-300 italic text-lg leading-relaxed font-serif">
                    Sincronizando con el servidor de IA...
                </p>
            </div>

            <button onclick="dispararDJ()" class="pulse w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] transition-all py-5 rounded-2xl font-black text-lg uppercase tracking-wider flex items-center justify-center space-x-3 group">
                <i class="fas fa-satellite-dish group-hover:rotate-12 transition-transform"></i>
                <span>Generar Locución Manual</span>
            </button>
        </div>

        <div class="flex justify-center space-x-8 text-slate-500 text-[10px] font-bold uppercase tracking-widest">
            <span class="flex items-center"><i class="fas fa-microchip mr-2 text-blue-500"></i> Azure Salome</span>
            <span class="flex items-center"><i class="fas fa-server mr-2 text-emerald-500"></i> Station 24</span>
        </div>
    </div>

    <script>
        async function update() {
            try {
                const r = await fetch('/api/status');
                const d = await r.json();
                document.getElementById('guion').innerText = d.guion;
                document.getElementById('fecha').innerText = d.fecha;
                document.getElementById('status').innerText = d.status;
                
                const led = document.getElementById('led');
                if(d.status.includes("Error")) led.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
                else if(d.status.includes("Procesando")) led.className = "w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_#f59e0b]";
                else led.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]";
            } catch(e) {}
        }

        async function dispararDJ() {
            if(!confirm("¿Deseas forzar una nueva locución ahora mismo?")) return;
            await fetch('/api/disparar', { method: 'POST' });
            document.getElementById('status').innerText = "Iniciando...";
        }

        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
