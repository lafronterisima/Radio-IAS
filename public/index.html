<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fronterísima | Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --blue-brand: #4A86E8;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --accent-green: #4ecca3;
            --input-bg: #252525;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* Estilos del Panel (Copiados de tu diseño con estilo) */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-top: 6px solid var(--blue-brand);
            width: 100%;
            max-width: 600px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-panel { text-align: center; margin-bottom: 25px; }
        .header-panel h1 { margin: 0; font-size: 1.8em; color: var(--blue-brand); text-transform: uppercase; font-weight: 900; italic; }
        
        .section-label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 700;
            color: var(--blue-brand);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
            color: white;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus { outline: none; border-color: var(--blue-brand); background: #2a2a2a; }

        .btn-ai { background: #5851db; color: white; font-weight: bold; border-radius: 12px; padding: 0 20px; transition: 0.3s; }
        .btn-ai:hover:not(:disabled) { background: #4740b3; transform: scale(1.02); }

        .btn-main {
            background: var(--accent-green);
            color: #000;
            width: 100%;
            font-weight: 900;
            padding: 20px;
            border-radius: 16px;
            text-transform: uppercase;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-main:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(78, 204, 163, 0.2); }

        #status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.85em;
            display: none;
        }

        .status-loading { background: #1e293b; color: #94a3b8; display: block; }
        .status-success { background: #064e3b; color: #6ee7b7; display: block; }
        .status-error { background: #7f1d1d; color: #fca5a5; display: block; }
    </style>
</head>
<body>

    <div id="login-screen" class="w-full max-w-sm bg-slate-900 rounded-[2rem] p-10 border border-slate-800 shadow-2xl text-center">
        <div class="mb-8">
            <h2 class="text-2xl font-black italic uppercase text-[#4A86E8] leading-none">Acceso Azura</h2>
            <p class="text-slate-500 text-[10px] uppercase tracking-[0.3em] mt-2">La Fronterísima</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="access-key" 
                class="w-full bg-black border border-slate-800 rounded-2xl py-4 px-6 focus:outline-none focus:border-[#4A86E8] text-center tracking-[0.5em] text-white" 
                placeholder="••••••">
            <button onclick="checkAccess()" 
                class="w-full bg-[#4A86E8] text-black font-black py-4 rounded-2xl hover:bg-blue-500 transition-all active:scale-95">
                ENTRAR
            </button>
            <p id="error-msg" class="text-red-500 text-xs font-bold hidden">Clave incorrecta. Intenta de nuevo.</p>
        </div>
    </div>

    <div id="panel-contenido" class="container hidden">
        <div class="card">
            <div class="header-panel">
                <h1>La Fronterísima</h1>
                <p style="color: var(--text-dim); font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px;">Notas surcando fronteras</p>
            </div>

            <span class="section-label">1. ¿Qué quieres decir hoy?</span>
            <div class="flex gap-2 mb-4">
                <input type="text" id="ideaInput" placeholder="Texto a redactar...">
                <button class="btn-ai" id="btnRedactar" onclick="redactarIA()">✨ Redactar</button>
            </div>

            <span class="section-label">2. Guion de Locución (Gonzalo Neural)</span>
            <textarea id="guionText" rows="4" placeholder="Aquí aparecerá el guion generado..."></textarea>

            <span class="section-label">3. Configuración</span>
            <input type="text" id="filename" placeholder="Nombre del archivo (ej: saludo_mañana)" class="mb-3">
            
            <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded-lg transition">
                <input type="checkbox" id="conFondo" checked class="w-4 h-4 accent-[#4A86E8]">
                <span class="text-sm text-slate-400">Incluir cortina musical (Sidechain)</span>
            </label>

            <button class="btn-main" id="btnProduccion" onclick="procesarProduccion()">
                🚀 SUBIR
            </button>

            <div id="status-box"></div>

            <div class="mt-8 pt-4 border-t border-white/5 flex justify-between items-center opacity-40 text-[10px] font-bold uppercase tracking-widest">
                <span>🎙️ Voz: Gonzalo Neutro CO</span>
                <span id="reloj-digital">00:00:00</span>
            </div>
        </div>
    </div>

    <script>
        // --- LÓGICA DE ACCESO ---
        async function checkAccess() {
            const password = document.getElementById('access-key').value;
            const errorMsg = document.getElementById('error-msg');
            const loginScreen = document.getElementById('login-screen');
            const panel = document.getElementById('panel-contenido');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    loginScreen.classList.add('hidden');
                    panel.classList.remove('hidden');
                } else {
                    errorMsg.classList.remove('hidden');
                    document.getElementById('access-key').value = "";
                }
            } catch (e) {
                alert("Error de conexión con el servidor");
            }
        }

        document.getElementById('access-key').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAccess();
        });

        // --- FUNCIONES DEL PANEL ---
        function updateReloj() {
            const ahora = new Date();
            document.getElementById('reloj-digital').innerText = ahora.toLocaleTimeString();
        }
        setInterval(updateReloj, 1000);
        updateReloj();

        function showStatus(msg, type) {
            const statusBox = document.getElementById('status-box');
            statusBox.innerText = msg;
            statusBox.className = 'status-' + type;
            statusBox.style.display = 'block';
        }

        async function redactarIA() {
            const idea = document.getElementById('ideaInput').value;
            if(!idea) return alert("Escribe una idea primero.");

            const btn = document.getElementById('btnRedactar');
            btn.disabled = true;
            showStatus("🤖 Redactando con Gemini...", "loading");

            try {
                const res = await fetch('/redactar-guion', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ idea })
                });
                const data = await res.json();
                document.getElementById('guionText').value = data.guion;
                showStatus("✅ Guion generado correctamente", "success");
            } catch (e) {
                showStatus("❌ Error en la redacción", "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function procesarProduccion() {
            const texto = document.getElementById('guionText').value;
            let nombre = document.getElementById('filename').value.trim();
            const conFondo = document.getElementById('conFondo').checked;
            const btn = document.getElementById('btnProduccion');

            if(!texto || !nombre) return alert("Faltan datos (guion o nombre).");
            
            nombre = nombre.replace(/[^a-z0-9_]/gi, '_').toLowerCase();
            if(!nombre.endsWith('.mp3')) nombre += '.mp3';

            btn.disabled = true;
            showStatus("🎙️ Procesando audio y subiendo...", "loading");

            try {
                const res = await fetch('/procesar-locucion', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ texto, nombreArchivo: nombre, conFondo })
                });

                if(res.ok) {
                    showStatus("🚀 ¡ÉXITO! Ya está en AzuraCast", "success");
                    document.getElementById('ideaInput').value = "";
                    document.getElementById('filename').value = "";
                } else {
                    throw new Error("Fallo en servidor");
                }
            } catch (e) {
                showStatus("❌ Error: " + e.message, "error");
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
