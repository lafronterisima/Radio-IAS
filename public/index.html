<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | La Fronterísima</title>
    <style>
        :root {
            --blue-brand: #4A86E8;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --accent-green: #4ecca3;
            --error-red: #ff5252;
            --input-bg: #252525;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 6px solid var(--blue-brand);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6em;
            letter-spacing: 1px;
            color: var(--blue-brand);
            text-transform: uppercase;
        }

        .header p {
            margin: 5px 0 0;
            color: var(--text-dim);
            font-style: italic;
            font-size: 0.95em;
        }

        .section-label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
            color: var(--blue-brand);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px;
            color: white;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--blue-brand);
            background: #2a2a2a;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-ai {
            background: #5851db;
            color: white;
            white-space: nowrap;
        }

        .btn-ai:hover:not(:disabled) { 
            background: #4740b3;
            transform: translateY(-1px);
        }

        .btn-main {
            background: var(--accent-green);
            color: #000;
            width: 100%;
            font-size: 1.1em;
            margin-top: 25px;
            padding: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-main:hover:not(:disabled) {
            background: #3eb38f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.3);
        }

        .btn:disabled {
            background: #444;
            color: #777;
            cursor: not-allowed;
            transform: none;
        }

        .options {
            margin-top: 15px;
            display: flex;
            align-items: center;
            font-size: 0.9em;
            color: var(--text-dim);
            cursor: pointer;
            user-select: none;
        }

        .options input { margin-right: 10px; cursor: pointer; }

        #status-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .status-loading { background: #2c3e50; color: #ecf0f1; display: block !important; }
        .status-success { background: #1b4332; color: #95d5b2; display: block !important; }
        .status-error { background: #431b1b; color: #d59595; display: block !important; }

        .footer-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #555;
            letter-spacing: 0.5px;
        }

        #reloj-digital {
            color: var(--blue-brand);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <h1>La Fronterísima</h1>
            <p>Notas surcando fronteras</p>
        </div>

        <span class="section-label">1. ¿Qué quieres decir hoy?</span>
        <div class="row">
            <input type="text" id="ideaInput" placeholder="Ej: Gran concierto de salsa en el centro...">
            <button class="btn btn-ai" id="btnRedactar" onclick="redactarIA()">
                ✨ Redactar
            </button>
        </div>

        <span class="section-label">2. Guion de Locución (Salomé Alegre)</span>
        <textarea id="guionText" rows="5" placeholder="¡Hola Cali! El guion aparecerá aquí con toda la energía..."></textarea>

        <span class="section-label">3. Configuración de Archivo</span>
        <input type="text" id="filename" placeholder="Nombre del archivo (ej: promo_lunes)">
        
        <div class="options" onclick="toggleCheckbox()">
            <input type="checkbox" id="conFondo" checked onclick="event.stopPropagation()">
            <label>Incluir cortina musical automática (Sidechain)</label>
        </div>

        <button class="btn btn-main" id="btnProduccion" onclick="procesarProduccion()">
            🚀 PRODUCIR Y SUBIR
        </button>

        <div id="status-box"></div>

       <div class="footer-info">
          <span>🎙️ VOZ: Salomé Neural CO (Cheerful)</span>
          <span id="reloj-digital">00:00:00</span>
      </div>
    </div>
</div>

<script>
    const statusBox = document.getElementById('status-box');
    const btnMain = document.getElementById('btnProduccion');
    const btnAi = document.getElementById('btnRedactar');

    // Reloj Digital
    function updateReloj() {
        const ahora = new Date();
        document.getElementById('reloj-digital').innerText = ahora.toLocaleTimeString();
    }
    setInterval(updateReloj, 1000);
    updateReloj();

    function toggleCheckbox() {
        const cb = document.getElementById('conFondo');
        cb.checked = !cb.checked;
    }

    function showStatus(msg, type) {
        statusBox.innerText = msg;
        statusBox.className = 'status-' + type;
        statusBox.style.display = 'block';
        if(type === 'success') {
            setTimeout(() => {
                statusBox.style.opacity = '0';
                setTimeout(() => { statusBox.style.display = 'none'; statusBox.style.opacity = '1'; }, 500);
            }, 5000);
        }
    }

    // Lógica para pedir redacción a Gemini
    async function redactarIA() {
        const idea = document.getElementById('ideaInput').value;
        if(!idea) return alert("Por favor, escribe una idea primero.");

        btnAi.disabled = true;
        showStatus("🤖 Gemini está redactando tu guion...", "loading");

        try {
            const res = await fetch('/redactar-guion', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ idea })
            });
            const data = await res.json();
            document.getElementById('guionText').value = data.guion;
            showStatus("✅ Guion listo para locución.", "success");
        } catch (e) {
            showStatus("❌ Error al conectar con el servidor de IA.", "error");
        } finally {
            btnAi.disabled = false;
        }
    }

    // Lógica para generar voz, mezclar y subir
    async function procesarProduccion() {
        const texto = document.getElementById('guionText').value;
        let nombre = document.getElementById('filename').value.trim();
        const conFondo = document.getElementById('conFondo').checked;

        if(!texto || !nombre) return alert("Necesitas un guion y un nombre de archivo.");
        
        // Limpiar nombre de archivo (solo letras, números y guiones)
        nombre = nombre.replace(/[^a-z0-9_]/gi, '_').toLowerCase();
        if(!nombre.endsWith('.mp3')) nombre += '.mp3';

        btnMain.disabled = true;
        showStatus("🎙️ Grabando voz y mezclando con música...", "loading");

        try {
            const response = await fetch('/procesar-locucion', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ texto, nombreArchivo: nombre, conFondo })
            });

            if(response.ok) {
                showStatus("🚀 ¡PRODUCCIÓN EXITOSA! Subido a AzuraCast.", "success");
                document.getElementById('ideaInput').value = "";
                document.getElementById('filename').value = "";
            } else {
                const errorMsg = await response.text();
                throw new Error(errorMsg);
            }
        } catch (e) {
            showStatus("❌ Error en la producción: " + e.message, "error");
        } finally {
            btnMain.disabled = false;
        }
    }
</script>

</body>
</html>
